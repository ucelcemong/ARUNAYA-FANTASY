<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#241C14">
<title>ARUNAYA FANTASY</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- ============ A. LOADING SCREEN ============ -->
  <section id="screen-loading" class="screen active">
    <div class="loading-center">
      <div class="loading-title-wrap">
        <h1 class="game-logo">ARUNAYA</h1>
        <div class="logo-sub">F A N T A S Y</div>
        <div class="logo-ornament"></div>
      </div>
      <div class="loading-bar-wrap">
        <div id="loading-bar"></div>
      </div>
      <p id="loading-text" class="loading-text">Memuat Dunia...</p>
    </div>
  </section>

  <!-- ============ B. MAIN MENU ============ -->
  <section id="screen-menu" class="screen">
    <div class="menu-inner">
      <header class="menu-header">
        <h1 class="game-logo small">ARUNAYA</h1>
        <div class="logo-sub">F A N T A S Y</div>
        <div class="logo-ornament"></div>
      </header>
      <nav class="menu-buttons">
        <button id="btn-start" class="menu-btn primary">MULAI</button>
        <button id="btn-continue" class="menu-btn" disabled>LANJUTKAN</button>
        <button id="btn-settings" class="menu-btn">PENGATURAN</button>
        <button id="btn-exit" class="menu-btn">KELUAR</button>
      </nav>
    </div>
    <p class="menu-version">ARUNAYA FANTASY — Stage 1 Prototype</p>
  </section>

  <!-- ============ C. CHARACTER SELECTION ============ -->
  <section id="screen-class" class="screen">
    <header class="screen-header">
      <button class="btn-back" data-back="screen-menu">‹ Kembali</button>
      <h2>PILIH CLASS</h2>
    </header>
    <div id="class-list" class="class-list"><!-- diisi lewat JS --></div>
    <div class="screen-footer">
      <button id="btn-class-confirm" class="menu-btn primary" disabled>PILIH CLASS INI</button>
    </div>
  </section>

  <!-- ============ D. CHARACTER CREATION ============ -->
  <section id="screen-create" class="screen">
    <header class="screen-header">
      <button class="btn-back" data-back="screen-class">‹ Kembali</button>
      <h2>BUAT KARAKTER</h2>
    </header>
    <div class="create-body">
      <div id="create-preview" class="create-preview"><!-- SVG via JS --></div>
      <div class="create-options">
        <div class="opt-group"><span class="opt-label">Gender</span><div id="opt-gender" class="opt-row"></div></div>
        <div class="opt-group"><span class="opt-label">Kulit</span><div id="opt-skin" class="opt-row"></div></div>
        <div class="opt-group"><span class="opt-label">Rambut</span><div id="opt-hair" class="opt-row"></div></div>
        <div class="opt-group"><span class="opt-label">Warna Rambut</span><div id="opt-haircolor" class="opt-row"></div></div>
        <div class="opt-group"><span class="opt-label">Mata</span><div id="opt-eyes" class="opt-row"></div></div>
        <div class="opt-group"><span class="opt-label">Pakaian</span><div id="opt-clothing" class="opt-row"></div></div>
      </div>
    </div>
    <div class="create-footer">
      <div class="nickname-wrap">
        <div class="nickname-label-row">
          <label for="nickname">Nama Panggilan</label>
          <span id="nick-count" class="nick-count">0/16</span>
        </div>
        <input id="nickname" type="text" maxlength="16" placeholder="Maks. 16 karakter" autocomplete="off">
        <p id="nickname-error" class="nickname-error"></p>
      </div>
      <button id="btn-start-game" class="menu-btn primary">MULAI PETUALANGAN</button>
    </div>
  </section>

  <!-- ============ E. MAIN GAME SCREEN ============ -->
  <section id="screen-game" class="screen">
    <canvas id="world-canvas" aria-label="Preview Dunia" role="img"></canvas>

    <header class="hud-top">
      <div class="hud-left">
        <div id="hud-avatar" class="hud-avatar"></div>
        <div class="hud-stats">
          <div class="hud-name-row">
            <span id="hud-name">-</span>
            <span id="hud-level" class="hud-level">Lv.1</span>
          </div>
          <div class="bar bar-hp"><div id="bar-hp"></div><span id="bar-hp-text">0/0</span></div>
          <div class="bar bar-mp"><div id="bar-mp"></div><span id="bar-mp-text">0/0</span></div>
          <div class="bar bar-exp"><div id="bar-exp"></div><span id="bar-exp-text">0/0</span></div>
        </div>
      </div>
      <div class="hud-right">
        <div class="hud-gold">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="#E8B54A" stroke="#9C6526" stroke-width="2"/><circle cx="12" cy="12" r="4.5" fill="none" stroke="#9C6526" stroke-width="1.5"/></svg>
          <span id="hud-gold">0</span>
        </div>
        <button id="btn-hud-menu" class="hud-menu-btn">MENU</button>
      </div>
    </header>

    <nav id="hud-bottom" class="hud-bottom">
      <button class="hud-btn" data-panel="CHARACTER" aria-label="Karakter">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="7.5" r="3.6"/><path d="M4.5 20.5c0-4.1 3.4-7.5 7.5-7.5s7.5 3.4 7.5 7.5z"/></svg>
        <span>CHARACTER</span>
      </button>
      <button class="hud-btn" data-panel="INVENTORY" aria-label="Inventory">
        <svg viewBox="0 0 24 24"><path d="M6.6 8.3h10.8l1.2 12H5.4l1.2-12z"/><path d="M9 8V6.8a3 3 0 0 1 6 0V8" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        <span>INVENTORY</span>
      </button>
      <button class="hud-btn" data-panel="QUEST" aria-label="Quest">
        <svg viewBox="0 0 24 24"><path d="M7 3.5h8.5L20 8v12.5H7z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M15.5 3.5V8H20" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M10 12h6M10 15.5h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>QUEST</span>
      </button>
      <button class="hud-btn" data-panel="MAP" aria-label="Map">
        <svg viewBox="0 0 24 24"><path d="M4 6.3 9.3 4l5.4 2.3L20 4v13.7l-5.3 2.3-5.4-2.3L4 20V6.3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9.3 4v13.7M14.7 6.3V20" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        <span>MAP</span>
      </button>
      <button class="hud-btn" data-panel="SETTINGS" aria-label="Pengaturan">
        <svg viewBox="0 0 24 24"><path d="M19.4 13c.04-.33.1-.66.1-1s-.06-.67-.1-1l2.1-1.65a.5.5 0 0 0 .12-.64l-2-3.46a.5.5 0 0 0-.6-.22l-2.5 1a7.3 7.3 0 0 0-1.7-1l-.4-2.65A.5.5 0 0 0 14 2h-4a.5.5 0 0 0-.5.42l-.4 2.65c-.6.26-1.17.6-1.7 1l-2.5-1a.5.5 0 0 0-.6.22l-2 3.46a.5.5 0 0 0 .12.64L4.6 11c-.04.33-.1.66-.1 1s.06.67.1 1l-2.1 1.65a.5.5 0 0 0-.12.64l2 3.46c.13.22.39.31.6.22l2.5-1c.53.4 1.1.74 1.7 1l.4 2.65A.5.5 0 0 0 10 22h4a.5.5 0 0 0 .5-.42l.4-2.65a7.3 7.3 0 0 0 1.7-1l2.5 1c.21.09.47 0 .6-.22l2-3.46a.5.5 0 0 0-.12-.64L19.4 13z"/><circle class="gear-hole" cx="12" cy="12" r="3.2"/></svg>
        <span>SETTINGS</span>
      </button>
    </nav>
  </section>

</div>

<!-- Modal generik (Pengaturan / Keluar / Menu HUD) -->
<div id="modal" class="modal hidden">
  <div class="modal-box">
    <h3 id="modal-title"></h3>
    <div id="modal-body"></div>
    <button id="modal-close" class="menu-btn">TUTUP</button>
  </div>
</div>

<!-- Toast notifikasi ringan -->
<div id="toast" class="toast"></div>

<script src="js/main.js"></script>
</body>
</html>
